# Place this file in ~/nginx/conf.d/ant-backend.conf on your VPS

server {
    listen 80;
    # If you have a subdomain, use: server_name ant.yourdomain.com;
    # If using IP, note that this will capture all traffic to 157.230.102.54 
    # unless other projects have their own server_name.
    server_name 157.230.102.54; 

    location / {
        # 'ant-backend' is the internal Docker hostname defined in docker-compose.yaml.
        # Docker's internal DNS handles this automatically within the 'proxy-network'.
        proxy_pass http://ant-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploads directly via Nginx for better performance
    location /uploads/ {
        # This path must match the volume mapping in nginx-proxy service
        # You'll need to add a volume mapping in your nginx-proxy service:
        # - ../Ant-website-backend/uploads:/var/www/ant_backend/uploads
        alias /var/www/ant_backend/uploads/;
    }
}
